services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enbandeja
      POSTGRES_USER: enbandeja
      POSTGRES_PASSWORD: enbandeja
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  postgres_data:
